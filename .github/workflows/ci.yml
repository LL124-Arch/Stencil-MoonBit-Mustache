name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Refresh registry
        run: |
          moon version --all
          moon update

      - name: Check formatting
        run: |
          moon fmt --check src

      - name: Check build
        run: moon check --deny-warn --target all

      - name: Build all targets
        run: moon build --target wasm,wasm-gc,js

      - name: Check generated interfaces
        run: |
          moon info --target all
          git diff --ignore-blank-lines --exit-code

      - name: Run cross-platform tests
        run: moon test --deny-warn --target wasm,wasm-gc,js

      - name: Run benchmark smoke check
        run: moon run cli -- benchmark

  native:
    name: Native Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry
        run: |
          moon version --all
          moon update

      - name: Run native tests
        run: |
          moon build --target native
          moon test --deny-warn --target native
